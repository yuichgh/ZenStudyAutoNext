name: Build macOS Safari Extension

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build macOS app and Safari extension
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project "zenstudy-auto-next-github/ZenStudy-Auto-Next-extension.xcodeproj" \
            -scheme "ZenStudy-Auto-Next-extension" \
            -configuration Release \
            -destination "generic/platform=macOS" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="" \
            build

      - name: Package macOS app as ZIP and DMG
        shell: bash
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/DerivedData/Build/Products/Release/ZenStudy-Auto-Next-extension.app"
          EXT="$APP/Contents/PlugIns/ZenStudy-Auto-Next-extension Extension.appex"
          test -d "$APP"
          test -d "$EXT"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign --verify --strict --verbose=2 "$EXT"

          # Keep the ZIP as a fallback and include a drag-to-Applications DMG.
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent \
            "$APP" "dist/ZenStudy-Auto-Next-extension-macos-arm64.zip"

          STAGING="$RUNNER_TEMP/ZenStudyAutoNext-dmg"
          mkdir -p "$STAGING"
          ditto "$APP" "$STAGING/ZenStudy-Auto-Next-extension.app"
          ln -s /Applications "$STAGING/Applications"

          DMG="$GITHUB_WORKSPACE/dist/ZenStudy-Auto-Next-extension-macos-arm64.dmg"
          hdiutil create \
            -volname "ZEN Study Auto Next" \
            -srcfolder "$STAGING" \
            -format UDZO \
            -ov "$DMG"
          hdiutil verify "$DMG"

      - name: Package Safari extension for temporary installation
        shell: bash
        run: |
          set -euo pipefail
          resources="zenstudy-auto-next-github/ZenStudy-Auto-Next-extension Extension/Resources"
          test -f "$resources/manifest.json"
          python3 -m json.tool "$resources/manifest.json" >/dev/null
          (
            cd "$resources"
            zip -qr "$GITHUB_WORKSPACE/dist/ZenStudyAutoNext-Safari-Temporary-Extension.zip" .
          )
          unzip -Z1 dist/ZenStudyAutoNext-Safari-Temporary-Extension.zip | grep -Fx manifest.json

      - name: Upload build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ZenStudyAutoNext-macOS
          path: |
            dist/*.zip
            dist/*.dmg
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: build
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download successful macOS build
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: ZenStudyAutoNext-macOS
          path: dist

      - name: Verify release assets and create checksums
        shell: bash
        run: |
          set -euo pipefail
          dmg="dist/ZenStudy-Auto-Next-extension-macos-arm64.dmg"
          app_zip="dist/ZenStudy-Auto-Next-extension-macos-arm64.zip"
          safari_zip="dist/ZenStudyAutoNext-Safari-Temporary-Extension.zip"
          test -s "$dmg"
          test -s "$app_zip"
          test -s "$safari_zip"
          (
            cd dist
            sha256sum \
              ZenStudy-Auto-Next-extension-macos-arm64.dmg \
              ZenStudy-Auto-Next-extension-macos-arm64.zip \
              ZenStudyAutoNext-Safari-Temporary-Extension.zip > SHA256SUMS.txt
          )

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="build-$GITHUB_RUN_NUMBER"
          dmg="dist/ZenStudy-Auto-Next-extension-macos-arm64.dmg"
          zip="dist/ZenStudy-Auto-Next-extension-macos-arm64.zip"
          safari_zip="dist/ZenStudyAutoNext-Safari-Temporary-Extension.zip"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; no duplicate release will be created."
          else
            gh release create "$tag" "$dmg" "$zip" "$safari_zip" "dist/SHA256SUMS.txt" \
              --target "$GITHUB_SHA" \
              --title "ZenStudyAutoNext Build #$GITHUB_RUN_NUMBER" \
              --generate-notes \
              --notes "Automatic development build without Developer ID or notarization. For Safari Developer settings, enable unsigned extensions. If the macOS host app does not register, extract ZenStudyAutoNext-Safari-Temporary-Extension.zip and select the extracted folder with Add Temporary Extension in Safari Developer settings (where supported)."
          fi
